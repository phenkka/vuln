server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Намеренно: листинг каталогов включён, security-заголовков нет,
    # server_tokens по умолчанию выдаёт версию nginx.
    autoindex on;

    location /app/ {
        proxy_pass http://backend:5000/;
    }
}
