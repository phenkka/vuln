stages:
  - security

gitleaks:
  stage: security
  tags: [docker]
  image: 
    name: zricethezav/gitleaks:v8.18.4
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - gitleaks detect --source . --log-opts="--all" --report-format json --report-path gitleaks-report.json --exit-code 1
  artifacts:
    when: always
    paths: 
      - gitleaks-report.json
    expire_in: 30 days

semgrep:
  stage: security
  tags: [docker]
  image:
    name: semgrep/semgrep:1.178.0-nonroot
    entrypoint: [""]
  variables:
    SEMGREP_FAIL_SEVERITIES: "ERROR,WARNING"
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - |
      semgrep scan \
        --config p/python \
        --config p/javascript \
        --config p/owasp-top-ten \
        --config p/security-audit \
        --config p/xss \
        --config p/secrets \
        --config p/ci \
        --config p/cwe-top-25 \
        --config p/command-injection \
        --metrics=off --json --output semgrep-report.json .
    - |
      python3 - <<'PY'
      import json, os, sys
      threshold = os.environ["SEMGREP_FAIL_SEVERITIES"]
      r = json.load(open("semgrep-report.json"))
      counts = {}
      for x in r.get("results", []):
          s = x["extra"]["severity"]
          counts[s] = counts.get(s, 0) + 1
          print(s, x["check_id"].split(".")[-1], x["path"] + ":" + str(x["start"]["line"]))
      print("Totals:", counts)
      print("Scan errors:", len(r.get("errors", [])))
      if counts.get(threshold, 0) > 0:
          print("GATE FAILED: findings with severity", threshold)
          sys.exit(1)
      PY
  artifacts:
    when: always
    paths:
      - semgrep-report.json
    expire_in: 30 days

trivy-sca:
  stage: security
  tags: [docker]
  image:
    name: aquasec/trivy:0.50.1
    entrypoint: [""]
  variables:
    TRIVY_SEVERITY: "CRITICAL,HIGH"
    TRIVY_EXIT_CODE: 1
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - trivy fs --scanners vuln --severity $TRIVY_SEVERITY --format json --output trivy-sca-python.json --exit-code $TRIVY_EXIT_CODE .
    - trivy fs --scanners vuln --severity $TRIVY_SEVERITY --format json --output trivy-sca-js.json --exit-code $TRIVY_EXIT_CODE ./frontend
    - trivy fs --scanners vuln --format cyclonedx --output sbom-python.json . || true
    - trivy fs --scanners vuln --format cyclonedx --output sbom-js.json ./frontend || true
  artifacts:
    when: always
    paths:
      - trivy-sca-python.json
      - trivy-sca-js.json
      - sbom-python.json
      - sbom-js.json
    expire_in: 30 days
  allow_failure: false