stages:
  - build
  - scans
  - report

variables:
  TRIVY_SEVERITY: "CRITICAL,HIGH"
  IMAGE_BACKEND: "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
  IMAGE_FRONTEND: "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA"

# Этап сборки образов, и sbom файлов, и тестовой среды
build-images:
  stage: build
  tags: [docker]
  image: 
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - mkdir -p /kaniko/ssl/certs
    - cat "$CI_SERVER_TLS_CA_FILE" >> /kaniko/ssl/certs/ca-certificates.crt
    - /kaniko/executor --context . --dockerfile Dockerfile --destination "$IMAGE_BACKEND" --digest-file backend.digest
    - /kaniko/executor --context ./frontend --dockerfile frontend/Dockerfile --destination "$IMAGE_FRONTEND" --digest-file frontend.digest
  artifacts:
    paths:
      - backend.digest
      - frontend.digest
    expire_in: 1 day

syft-sbom:
  stage: build
  tags: [docker]
  image:
    name: anchore/syft:v1.54.1-debug
    entrypoint: [""]
  needs:
    - job: build-images
  variables:
    SYFT_REGISTRY_AUTH_AUTHORITY: $CI_REGISTRY
    SYFT_REGISTRY_AUTH_USERNAME: $CI_REGISTRY_USER
    SYFT_REGISTRY_AUTH_PASSWORD: $CI_REGISTRY_PASSWORD
    SYFT_CHECK_FOR_APP_UPDATE: "false"
  script:
    - export SYFT_REGISTRY_CA_CERT="$CI_SERVER_TLS_CA_FILE"
    - BACKEND="$CI_REGISTRY_IMAGE/backend@$(cat backend.digest)"
    - FRONTEND="$CI_REGISTRY_IMAGE/frontend@$(cat frontend.digest)"
    - /syft "registry:$BACKEND" -o cyclonedx-json@1.6=sbom-backend.cdx.json
    - /syft "registry:$FRONTEND" -o cyclonedx-json@1.6=sbom-frontend.cdx.json
    - /syft dir:frontend --source-name frontend --source-version "$CI_COMMIT_SHORT_SHA" -o cyclonedx-json@1.6=sbom-frontend-deps.cdx.json
  artifacts:
    paths:
      - sbom-backend.cdx.json
      - sbom-frontend.cdx.json
      - sbom-frontend-deps.cdx.json
    expire_in: 30 days

test-stage:
  stage: build
  tags: [docker]
  image:
    name: alpine/git:2.47.2
    entrypoint: [""]
  needs:
    - job: build-images
  variables:
    LOG_OPTS: "--log-driver fluentd --log-opt fluentd-address=127.0.0.1:24224 --log-opt fluentd-async=true --log-opt tag={{.Name}}"
  script:
    - chmod 600 "$STAGING_SSH_KEY"
    - SSH_OPTS="-i $STAGING_SSH_KEY -o UserKnownHostsFile=$STAGING_KNOWN_HOSTS -o StrictHostKeyChecking=yes -o BatchMode=yes"
    - TARGET="$STAGING_USER@$STAGING_HOST"
    - BACKEND="$CI_REGISTRY_IMAGE/backend@$(cat backend.digest)"
    - FRONTEND="$CI_REGISTRY_IMAGE/frontend@$(cat frontend.digest)"
    - |
      echo "$CI_REGISTRY_PASSWORD" | ssh $SSH_OPTS -o ExitOnForwardFailure=yes \
        -R 127.0.0.1:5050:gitlab.test:5050 \
        -R 127.0.0.1:443:gitlab.test:443 \
        "$TARGET" "docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY && docker pull $BACKEND && docker pull $FRONTEND && docker logout $CI_REGISTRY"
    - |
      ssh $SSH_OPTS "$TARGET" "
        set -e
        docker network inspect vulnshop >/dev/null 2>&1 || docker network create vulnshop
        docker rm -f backend frontend >/dev/null 2>&1 || true
        docker run -d --name backend --network vulnshop --restart unless-stopped -p 5000:5000 $LOG_OPTS $BACKEND
        docker run -d --name frontend --network vulnshop --restart unless-stopped -p 80:80 $LOG_OPTS $FRONTEND
      "
    - |
      for i in $(seq 1 30); do
        if wget -q -O /dev/null "http://$STAGING_HOST/" && wget -q -O /dev/null "http://$STAGING_HOST:5000/"; then
          echo "Staging is up"
          break
        fi
        if [ "$i" -eq 30 ]; then echo "Staging did not respond"; exit 1; fi
        sleep 2
      done

# Этап проверки на безопасность
gitleaks:
  stage: scans
  tags: [docker]
  image: 
    name: zricethezav/gitleaks:v8.18.4
    entrypoint: [""]
  needs: []
  variables:
    GIT_DEPTH: 0
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git config --global http.sslCAInfo "$CI_SERVER_TLS_CA_FILE"
    - git fetch origin '+refs/heads/*:refs/remotes/origin/*'
    - gitleaks detect --source . --log-opts="--all" --report-format json --report-path gitleaks-report.json --exit-code 1
  artifacts:
    when: always
    paths: 
      - gitleaks-report.json
    expire_in: 30 days

semgrep:
  stage: scans
  tags: [docker]
  image:
    name: semgrep/semgrep:1.178.0-nonroot
    entrypoint: [""]
  needs: []
  variables:
    SEMGREP_FAIL_SEVERITIES: "ERROR,WARNING"
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - |
      semgrep scan \
        --config p/python \
        --config p/javascript \
        --config p/owasp-top-ten \
        --config p/security-audit \
        --config p/xss \
        --config p/secrets \
        --config p/ci \
        --config p/cwe-top-25 \
        --config p/command-injection \
        --metrics=off --json --output semgrep-report.json .
    - |
      python3 - <<'PY'
      import json, os, sys
      threshold_str = os.environ["SEMGREP_FAIL_SEVERITIES"]
      thresholds = [s.strip() for s in threshold_str.split(",")]
      r = json.load(open("semgrep-report.json"))
      counts = {}
      for x in r.get("results", []):
          s = x["extra"]["severity"]
          counts[s] = counts.get(s, 0) + 1
          print(s, x["check_id"].split(".")[-1], x["path"] + ":" + str(x["start"]["line"]))
      print("Totals:", counts)
      print("Scan errors:", len(r.get("errors", [])))
      failed = False
      for t in thresholds:
          if counts.get(t, 0) > 0:
              print(f"Findings with severity {t}")
              failed = True
      if r.get("errors"):
        print("Semgrep reported scan errors - coverage is incomplete")
        failed = True
      if failed:
          sys.exit(1)
      else:
          print("No findings with threshold severities")
      PY
  artifacts:
    when: always
    paths:
      - semgrep-report.json
    expire_in: 30 days

dt-sca:
  stage: scans
  tags: [docker]
  image:
    name: curlimages/curl:8.22.0
    entrypoint: [""]
  needs:
    - job: syft-sbom
  variables:
    DT_FAIL_SEVERITIES: "CRITICAL|HIGH"
  script:
    - FAILED=0
    - |
      for C in backend frontend frontend-deps; do
        PROJECT="$CI_PROJECT_NAME-$C"
        TOKEN=$(curl -sSf -X POST "$DT_URL/api/v1/bom" -H "X-Api-Key: $DT_API_KEY" \
          -F autoCreate=true -F "projectName=$PROJECT" -F "projectVersion=$CI_COMMIT_REF_NAME" \
          -F "bom=@sbom-$C.cdx.json" | cut -d'"' -f4)
        [ -n "$TOKEN" ] || { echo "Upload of sbom-$C.cdx.json failed"; exit 1; }
        for i in $(seq 1 150); do
          STATUS=$(curl -sSf "$DT_URL/api/v1/event/token/$TOKEN" -H "X-Api-Key: $DT_API_KEY")
          case "$STATUS" in *'"processing":false'*) break ;; esac
          sleep 2
        done
        UUID=$(curl -sSf -G "$DT_URL/api/v1/project/lookup" -H "X-Api-Key: $DT_API_KEY" \
          --data-urlencode "name=$PROJECT" --data-urlencode "version=$CI_COMMIT_REF_NAME" \
          | grep -o '"uuid":"[^"]*"' | head -n1 | cut -d'"' -f4)
        curl -sSf "$DT_URL/api/v1/finding/project/$UUID" -H "X-Api-Key: $DT_API_KEY" -o "dt-findings-$C.json"
        SUMMARY=""
        for S in CRITICAL HIGH MEDIUM LOW; do
          SUMMARY="$SUMMARY $S=$(grep -o "\"severity\":\"$S\"" "dt-findings-$C.json" | wc -l | tr -d ' ' || true)"
        done
        echo "$C:$SUMMARY"
        if grep -qE "\"severity\":\"($DT_FAIL_SEVERITIES)\"" "dt-findings-$C.json"; then FAILED=1; fi
      done
    - |
      if [ $FAILED -eq 1 ]; then
        echo "Dependency-Track found CRITICAL or HIGH vulnerabilities"
        exit 1
      fi
      echo "No critical/high vulnerabilities found"
  artifacts:
    when: always
    paths:
      - dt-findings-backend.json
      - dt-findings-frontend.json
      - dt-findings-frontend-deps.json
    expire_in: 30 days

trivy-container:
  stage: scans
  tags: [docker]
  image:
    name: aquasec/trivy:0.50.1
    entrypoint: [""]
  needs: []
  script:
    - FAILED=0
    - trivy config --severity $TRIVY_SEVERITY --format json --exit-code 1 --output trivy-config-backend.json Dockerfile || FAILED=1
    - trivy config --severity $TRIVY_SEVERITY --format json --exit-code 1 --output trivy-config-frontend.json frontend/Dockerfile || FAILED=1
    - |
      if [ $FAILED -eq 1 ]; then
        echo "Trivy found CRITICAL or HIGH misconfigurations in Dockerfiles"
        exit 1
      else
        echo "No critical/high misconfigurations found"
      fi
  artifacts:
    when: always
    paths:
      - trivy-config-backend.json
      - trivy-config-frontend.json
    expire_in: 30 days

zap-scan:
  stage: scans
  tags: [docker]
  image:
    name: ghcr.io/zaproxy/zaproxy:2.16.1
    entrypoint: [""]
  needs:
    - job: test-stage
  variables:
    ZAP_FAIL_RISK: "3"
  script:
    - ln -s "$CI_PROJECT_DIR" /zap/wrk   
    - zap-baseline.py -t "http://$STAGING_HOST/" -I -z "-Xmx1g" -J zap-baseline-frontend.json -r zap-baseline-frontend.html
    - zap-full-scan.py -t "http://$STAGING_HOST:5000/" -m 2 -I -z "-Xmx1g -config scanner.threadPerHost=2" -J zap-full-backend.json -r zap-full-backend.html
    - |
      python3 - <<'PY'
      import json, os, sys
      limit = int(os.environ["ZAP_FAIL_RISK"])
      names = {0: "Info", 1: "Low", 2: "Medium", 3: "High"}
      failed = False
      for report in ["zap-baseline-frontend.json", "zap-full-backend.json"]:
          r = json.load(open(report))
          for site in r.get("site", []):
              for a in site.get("alerts", []):
                  risk = int(a["riskcode"])
                  print(f'{names[risk]:7} {a["alert"]} (x{a["count"]}) {site["@name"]}')
                  if risk >= limit:
                      failed = True
      if failed:
          print(f"ZAP found alerts with risk >= {names[limit]}")
          sys.exit(1)
      print(f"No ZAP alerts with risk >= {names[limit]}")
      PY
  artifacts:
    when: always
    paths:
      - zap-baseline-frontend.json
      - zap-baseline-frontend.html
      - zap-full-backend.json
      - zap-full-backend.html
    expire_in: 30 days
  
telemetry:
  stage: report
  tags: [docker]
  image: python:3.13-alpine
  when: always
  script:
    - python3 infra/telemetry.py