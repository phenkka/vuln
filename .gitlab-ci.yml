stages:
  - build
  - security

variables:
  TRIVY_SEVERITY: "CRITICAL,HIGH"
  IMAGE_BACKEND: "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
  IMAGE_FRONTEND: "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA"

# Этап сборки образов
build-images:
  stage: build
  tags: [docker]
  image: 
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_ISOLATION: chroot
    BUILDAH_FORMAT: docker
  script:
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/Dockerfile.back" --destination "$IMAGE_BACKEND" --digest-file backend.digest
    - /kaniko/executor --context "$CI_PROJECT_DIR/frontend" --dockerfile "$CI_PROJECT_DIR/frontend/Dockerfile.front" --destination "$IMAGE_FRONTEND" --digest-file frontend.digest
  artifacts:
    paths:
      - backend.digest
      - frontend.digest
    expire_in: 1 day

# Этап проверки на безопасность
gitleaks:
  stage: security
  tags: [docker]
  image: 
    name: zricethezav/gitleaks:v8.18.4
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - gitleaks detect --source . --log-opts="--all" --report-format json --report-path gitleaks-report.json --exit-code 1
  artifacts:
    when: always
    paths: 
      - gitleaks-report.json
    expire_in: 30 days

semgrep:
  stage: security
  tags: [docker]
  image:
    name: semgrep/semgrep:1.178.0-nonroot
    entrypoint: [""]
  variables:
    SEMGREP_FAIL_SEVERITIES: "ERROR,WARNING"
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - |
      semgrep scan \
        --config p/python \
        --config p/javascript \
        --config p/owasp-top-ten \
        --config p/security-audit \
        --config p/xss \
        --config p/secrets \
        --config p/ci \
        --config p/cwe-top-25 \
        --config p/command-injection \
        --metrics=off --json --output semgrep-report.json .
    - |
      python3 - <<'PY'
      import json, os, sys
      threshold_str = os.environ["SEMGREP_FAIL_SEVERITIES"]
      thresholds = [s.strip() for s in threshold_str.split(",")]
      r = json.load(open("semgrep-report.json"))
      counts = {}
      for x in r.get("results", []):
          s = x["extra"]["severity"]
          counts[s] = counts.get(s, 0) + 1
          print(s, x["check_id"].split(".")[-1], x["path"] + ":" + str(x["start"]["line"]))
      print("Totals:", counts)
      print("Scan errors:", len(r.get("errors", [])))
      failed = False
      for t in thresholds:
          if counts.get(t, 0) > 0:
              print(f"Findings with severity {t}")
              failed = True
      if failed:
          sys.exit(1)
      else:
          print("No findings with threshold severities")
      PY
  artifacts:
    when: always
    paths:
      - semgrep-report.json
    expire_in: 30 days

trivy-sca:
  stage: security
  tags: [docker]
  image:
    name: aquasec/trivy:0.50.1
    entrypoint: [""]
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - FAILED=0
    - trivy fs --scanners vuln --skip-dirs frontend --severity $TRIVY_SEVERITY --format json --exit-code 1 --output trivy-sca-python.json . || FAILED=1
    - trivy fs --scanners vuln --severity $TRIVY_SEVERITY --format json --exit-code 1 --output trivy-sca-js.json ./frontend || FAILED=1
    - trivy fs --scanners vuln --skip-dirs frontend --format cyclonedx --output sbom-python.json .
    - trivy fs --scanners vuln --format cyclonedx --output sbom-js.json ./frontend
    - |
      if [ $FAILED -eq 1 ]; then
        echo "Trivy found CRITICAL or HIGH vulnerabilities"
        exit 1
      else
        echo "No critical/high vulnerabilities found"
      fi
  artifacts:
    when: always
    paths:
      - trivy-sca-python.json
      - trivy-sca-js.json
      - sbom-python.json
      - sbom-js.json
    expire_in: 30 days

trivy-container:
  stage: security
  tags: [docker]
  image:
    name: aquasec/trivy:0.50.1
    entrypoint: [""]
  needs:
    - job: build-images
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - export SSL_CERT_FILE="$CI_SERVER_TLS_CA_FILE"
    - FAILED=0
    - BACKEND="$CI_REGISTRY_IMAGE/backend@$(cat backend.digest)"
    - FRONTEND="$CI_REGISTRY_IMAGE/frontend@$(cat frontend.digest)"
    - trivy config --severity $TRIVY_SEVERITY --format json --exit-code 1 --output trivy-config-backend.json Dockerfile.back || FAILED=1
    - trivy config --severity $TRIVY_SEVERITY --format json --exit-code 1 --output trivy-config-frontend.json frontend/Dockerfile.front || FAILED=1
    - trivy image --severity $TRIVY_SEVERITY --format json --exit-code 1 --output trivy-image-backend.json $IMAGE_BACKEND || FAILED=1
    - trivy image --severity $TRIVY_SEVERITY --format json --exit-code 1 --output trivy-image-frontend.json $IMAGE_FRONTEND || FAILED=1
    - trivy image --format cyclonedx --output sbom-backend.json $IMAGE_BACKEND
    - trivy image --format cyclonedx --output sbom-frontend.json $IMAGE_FRONTEND
    - |
      if [ $FAILED -eq 1 ]; then
        echo "Trivy found CRITICAL or HIGH vulnerabilities"
        exit 1
      else
        echo "No critical/high vulnerabilities found"
      fi
  artifacts:
    when: always
    paths:
      - trivy-config-backend.json
      - trivy-config-frontend.json
      - trivy-image-backend.json
      - trivy-image-frontend.json
      - sbom-backend.json
      - sbom-frontend.json
    expire_in: 30 days